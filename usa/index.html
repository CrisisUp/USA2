<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorando os EUA: Filmes e Séries por Estado</title>
    <meta
      name="description"
      content="Mapa interativo dos EUA com curadoria de filmes e séries por estado."
    />
    <!--meta name="theme-color" content="#1a2a3a" /-->
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <main>
      <h1>Explorando os EUA: Filmes e Séries por Estado</h1>

      <div id="search-container">
        <input
          type="text"
          id="search-input"
          placeholder="Buscar estado ou filme..."
          aria-label="Campo de busca por estado ou filme"
        />
        <button id="search-button" aria-label="Botão de busca">Buscar</button>
      </div>

      <div id="filters-container">
        <div id="filters">
          <div
            id="map-mode-toggle"
            class="map-mode-toggle"
            role="group"
            aria-label="Modo de visualização do mapa"
          >
            <button
              type="button"
              id="mode-filmes"
              class="map-mode-btn active"
              data-mode="filmes"
              aria-pressed="true"
              title="Mostrar estados com mais filmes"
            >
              <span aria-hidden="true">🎬</span>
              <span class="sr-only">Filmes</span>
            </button>
            <button
              type="button"
              id="mode-series"
              class="map-mode-btn"
              data-mode="series"
              aria-pressed="false"
              title="Mostrar estados com mais séries"
            >
              <span aria-hidden="true">📺</span>
              <span class="sr-only">Séries</span>
            </button>
          </div>
          <label for="type-filter">Tipo:</label>
          <select id="type-filter" aria-label="Filtrar por tipo">
            <option value="all">Todos</option>
            <option value="Filme">Filmes</option>
            <option value="Série">Séries</option>
          </select>
          <label for="decade-filter">Década:</label>
          <select id="decade-filter" aria-label="Filtrar por década">
            <option value="all">Todas</option>
            <option value="1930s">1930s</option>
            <option value="1940s">1940s</option>
            <option value="1950s">1950s</option>
            <option value="1960s">1960s</option>
            <option value="1970s">1970s</option>
            <option value="1980s">1980s</option>
            <option value="1990s">1990s</option>
            <option value="2000s">2000s</option>
            <option value="2010s">2010s</option>
            <option value="2020s">2020s</option>
          </select>
          <label for="min-rating">Nota mínima:</label>
          <select id="min-rating" aria-label="Filtrar por nota mínima">
            <option value="0">Qualquer</option>
            <option value="7">7+</option>
            <option value="8">8+</option>
            <option value="9">9+</option>
          </select>
          <input
            type="text"
            id="favorites-filter"
            placeholder="Filtrar por favorito (☆)"
            aria-label="Mostrar apenas favoritos"
          />
          <button
            id="surprise-button"
            type="button"
            aria-label="Surpreenda-me com um título aleatório"
          >
            Surpreenda-me!
          </button>
        </div>
      </div>
      <div id="map-container">
        <p id="map-loading-message">Carregando mapa...</p>
      </div>

      <div id="details-container">
        <h2 class="state-title" id="selected-state-title">
          Clique em um estado para ver os filmes e séries!
        </h2>
        <ul class="media-list" id="media-list"></ul>
      </div>
    </main>
    <script type="module" src="js/main.js"></script>
    <script>
      // Registra o service worker para suporte offline/PWA (apenas em HTTPS ou localhost)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.warn('Falha ao registrar o service worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
