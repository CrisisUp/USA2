# .github/workflows/ci.yml — CI/CD Pipeline
# Executa lint, testes, testes a11y e build em PRs e push para main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissões mínimas necessárias
permissions:
  contents: read

jobs:
  lint-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # package-lock.json é intencionalmente excluído do versionamento
      # (.gitignore) — por isso usamos `npm install` e deixamos o setup-node
      # detectar o caminho de cache automaticamente (sem cache-dependency-path).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run format check
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run syntax check
        run: npm run check

  a11y:
    name: Acessibilidade (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # package-lock.json é intencionalmente excluído do versionamento
      # (.gitignore) — por isso usamos `npm install` e deixamos o setup-node
      # detectar o caminho de cache automaticamente (sem cache-dependency-path).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start HTTP server
        run: |
          cd usa
          python3 -m http.server 8080 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 3

      - name: Run a11y tests
        run: TEST_BASE_URL=http://localhost:8080 npm run test:a11y

      - name: Stop HTTP server
        if: always()
        run: kill $SERVER_PID

